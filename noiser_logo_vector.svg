<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Pure Deep Black Background -->
  <rect width="800" height="800" fill="#0a0a0a" />

  <!-- Minimalist N! Producer Mark -->
  <g transform="translate(400, 430)" text-anchor="middle">
    <!-- Letter N in Pure White -->
    <text x="-40" y="0" font-family="'Space Grotesk', 'Syne', -apple-system, sans-serif" font-size="280" font-weight="900" fill="#f5f5f5" letter-spacing="-5">N</text>
    
    <!-- Exclamation Mark ! in Neon Acid Green -->
    <text x="140" y="0" font-family="'Space Grotesk', 'Syne', -apple-system, sans-serif" font-size="280" font-weight="900" fill="#00FF66" letter-spacing="0">!</text>
  </g>
</svg>
